[package]
name = "voice"
version = "0.1.0"
description = "Free, offline voice cleanup for your recordings. Part of KreoKit."
authors = ["KreoKit contributors"]
license = "MIT OR Apache-2.0"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiling the vendored RNNoise C library, and checking its downloaded model (build.rs).
cc = "1.9.0"
sha2 = "0.10.9"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Playback through the system's audio output (CoreAudio, WASAPI, ALSA).
cpal = "0.18.2"
# Reads the preview cache for playback without loading it into memory.
memmap2 = "=0.9.11"

# Free disk space before writing the preview cache (statvfs); already in the tree through other crates.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[profile.dev]
opt-level = 1

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
